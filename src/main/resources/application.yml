server:
  port: 8080

spring:
  application:
    name: mentorhub-backend

  datasource:
    url: jdbc:postgresql://localhost:5432/mentorhub
    username: mentorhub
    password: mentorhub

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  mail:
    host: smtp-relay.brevo.com
    port: 587
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    # repair-on-migrate намеренно НЕ включён здесь: базовый файл действует и для prod,
    # а там авто-починка контрольных сумм молча узаконила бы правку уже применённой
    # миграции. Для локальной разработки он включён в application-dev.yml.

  jackson:
    serialization:
      write-dates-as-timestamps: false

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 12MB

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  health:
    mail:
      # Недоступность SMTP не значит, что сервис нерабочий: письма уходят асинхронно.
      # Иначе любой сбой почты роняет /actuator/health в DOWN (503), и healthcheck
      # docker-compose вместе с Cloud Run убивают полностью живой контейнер.
      enabled: false

logging:
  level:
    org.springframework.security: INFO
    org.hibernate.SQL: INFO

app:
  mail:
    from: ${MAIL_FROM:no-reply@mentorhub.local}
    enabled: ${MAIL_ENABLED:true}

  frontend:
    url: ${FRONTEND_URL:http://localhost:3000}

  websocket:
    enabled: ${WEBSOCKET_ENABLED:true}

  jwt:
    # Значение по умолчанию — общеизвестный тестовый ключ из публичного репозитория,
    # пригоден только для локального запуска. Любой стенд должен задавать JWT_SECRET.
    secret: ${JWT_SECRET:c3VwZXItc2VjdXJlLXRlc3Qta2V5LXN1cGVyLXNlY3VyZS10ZXN0LWtleQ==}
    access-token-expiration-minutes: 15
    refresh-token-expiration-days: 30

  verification:
    code-expiration-minutes: 15
    resend-cooldown-seconds: 60
    max-attempts: 5

  storage:
    type: ${STORAGE_TYPE:local}
    local:
      upload-dir: uploads
      public-base-url: http://localhost:8080
      avatar-max-size-bytes: 10485760
    gcs:
      bucket-name: ${GCS_BUCKET_NAME:mentorhub-avatars}
      public-base-url: ${GCS_PUBLIC_BASE_URL:https://storage.googleapis.com/mentorhub-avatars}
      avatar-max-size-bytes: 10485760

  rate-limit:
    requests-per-minute: 10
    paths:
      - /api/auth/login
      - /api/auth/register/student
      - /api/auth/forgot-password
      - /api/auth/reset-password

  admin:
    email: ${ADMIN_EMAIL:admin@mentorhub.kg}
    password: ${ADMIN_PASSWORD:admin123}

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui
    enabled: ${SWAGGER_ENABLED:true}

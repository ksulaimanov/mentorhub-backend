name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Новый пуш в ту же ветку отменяет предыдущий прогон.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Build & test
    runs-on: ubuntu-latest

    # Flyway валидирует схему на старте контекста, поэтому Postgres нужен
    # даже для @SpringBootTest, который сам по себе ничего не пишет.
    # Координаты совпадают с дефолтами application.yml.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: mentorhub
          POSTGRES_USER: mentorhub
          POSTGRES_PASSWORD: mentorhub
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mentorhub"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      # spring.mail.* объявлены без значений по умолчанию — без них контекст не поднимется.
      # Реальная почта в CI не отправляется.
      MAIL_USERNAME: ci@example.invalid
      MAIL_PASSWORD: ci-placeholder

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
          cache: maven

      # Testcontainers берёт Docker-демон раннера, отдельная настройка не нужна.
      - name: Verify
        run: ./mvnw -B --no-transfer-progress verify

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: target/surefire-reports/
          if-no-files-found: ignore
          retention-days: 7

  image:
    name: Docker image
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # Пока только проверяем, что образ собирается. Публикация появится
      # вместе с registry — см. deploy.yml.
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: mentorhub-backend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
